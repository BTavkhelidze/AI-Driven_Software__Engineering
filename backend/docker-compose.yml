version: '3.9'

services:
  mysql_db: 
    container_name: ecommerce-mysql-dev
    image: mysql:8.0
    restart: always

    ports: 
     - '3306:3306'
     
    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}    
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
networks:
  ecommerce-network:
